services:
  aws:
    enabled: true
    relative_date_range: "last_quarter"
    output_directory: "invoices/aws"
    login_url: "https://aws.amazon.com/console/"
    dashboard_url: "https://us-east-1.console.aws.amazon.com/billing/home#/bills"
    dashboard_marker: "AWS estimated bill summary"
  heroku:
    enabled: true
    relative_date_range: "last_quarter"
    output_directory: "invoices/heroku"
    login_url: "https://dashboard.heroku.com/login"
    dashboard_url: "https://dashboard.heroku.com/account/billing"
    dashboard_marker: "Billing Information"
  google_cloud:
    enabled: true
    relative_date_range: "last_quarter"
    output_directory: "invoices/google_cloud"
    login_url: "https://console.cloud.google.com/login"
    dashboard_url: "https://console.cloud.google.com/billing/YOUR_BILLING_ACCOUNT_NUMBER/invoices"
    dashboard_marker: "Invoices"
  openai:
    enabled: true
    relative_date_range: "last_quarter"
    output_directory: "invoices/openai"
    login_url: "https://platform.openai.com/login"
    dashboard_url: "https://platform.openai.com/settings/organization/billing/history"
    dashboard_marker: "Billing history"
    # Auth0 session lives in the Chrome profile (not storage_state JSON).
    # Sign in once per docs/specs/openai/login.md, then AID reuses this profile.
    user_data_dir: ".aid/chrome-openai"
    browser_channel: "chrome"
  google_ads:
    enabled: true
    relative_date_range: "last_quarter"
    output_directory: "invoices/google_ads"
    login_url: "https://ads.google.com/"
    dashboard_url: "https://ads.google.com/aw/billing/documents"
    dashboard_marker: "Billing activity"
  
login_markers:
  - "Log in"
  - "Sign in"
  - "Login"

download:
  format: "%Y-%m-invoice.pdf"
