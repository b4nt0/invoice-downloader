services:
  aws:
    enabled: true
    relative_date_range: "last_quarter"
    output_directory: "invoices/aws"
    login_url: "https://aws.amazon.com/console/"
    dashboard_url: "https://us-east-1.console.aws.amazon.com/billing/home#/bills"
    dashboard_marker: "AWS estimated bill summary"
  heroku:
    enabled: true
    relative_date_range: "last_quarter"
    output_directory: "invoices/heroku"
    login_url: "https://dashboard.heroku.com/login"
    dashboard_url: "https://dashboard.heroku.com/account/billing"
    dashboard_marker: "Billing Information"
  google_cloud:
    enabled: false  # Reserved for future use
    relative_date_range: "last_quarter"
    output_directory: "invoices/google_cloud"
    login_url: "https://console.cloud.google.com/login"
    dashboard_url: "https://console.cloud.google.com/billing/invoices"
  openai:
    enabled: false  # Reserved for future use
    relative_date_range: "last_quarter"
    output_directory: "invoices/openai"
    login_url: "https://openai.com/login"
    dashboard_url: "https://openai.com/invoices"
  google_ads:
    enabled: false  # Reserved for future use
    relative_date_range: "last_quarter"
    output_directory: "invoices/google_ads"
    login_url: "https://ads.google.com/login"
    dashboard_url: "https://ads.google.com/invoices"
  
login_markers:
  - "Log in"
  - "Sign in"
  - "Login"

download:
  format: "%Y-%m-invoice.pdf"
